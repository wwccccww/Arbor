# Local / CI Postgres 16 + pgvector.
#   docker compose -f infra/compose/postgres.yml up -d
#   DATABASE_URL=postgresql://arbor:arbor@127.0.0.1:5432/arbor
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arbor
      POSTGRES_PASSWORD: arbor
      POSTGRES_DB: arbor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbor -d arbor"]
      interval: 5s
      timeout: 5s
      retries: 10
