# Optional MinIO for local S3-compatible object storage.
#   docker compose -f infra/compose/minio.yml up -d
# Wait a few seconds for bucket creation, then set .env (see docs/local-dev.md).
#
# minio/minio and minio/mc are separate images — RELEASE tags do not always match.
# Verify on Docker Hub before changing either tag.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arbor
      MINIO_ROOT_PASSWORD: arbor-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 arbor arbor-secret &&
      mc mb -p local/arbor || true
      "

volumes:
  minio-data:
