name: ci
on:
  pull_request:
  push:
    branches: [main, cursor/**]
jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arbor
          POSTGRES_PASSWORD: arbor
          POSTGRES_DB: arbor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbor -d arbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arbor:arbor@localhost:5432/arbor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api,postgres,observability]"
      - run: python3 -m ruff check src tests
      - run: python3 -m mypy src/arbor/domain src/arbor/ports
      - run: python3 scripts/validate_openapi.py
      - run: python3 scripts/validate_openapi_fastapi.py
      - run: python3 -m pytest tests/unit tests/architecture tests/eval tests/api tests/contract -q -m "not llm"
      - run: python3 -m pytest tests/integration/observability/test_prometheus_integration.py -q --tb=short
      - run: python3 -m arbor.adapters.inbound.cli.eval_cli --suite v1 --strategy all --backend postgres
      - run: python3 -m arbor.adapters.inbound.cli.eval_cli --suite ragas-v1 --strategy all --backend postgres
      - run: python3 -m arbor.adapters.inbound.cli.eval_cli --suite agent-ablation-v1 --mode agent --strategy all
  agent-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api]"
      - run: python3 scripts/fetch_public_benchmarks.py --benchmark bfcl --only smoke
      - run: python3 -m pytest tests/eval/test_agent_smoke.py tests/eval/test_agent_evolution.py tests/eval/test_agent_ablation.py tests/eval/test_agent_security_smoke.py tests/eval/test_demo_v1_smoke.py tests/eval/test_multimodal_smoke.py tests/eval/test_memory_smoke.py tests/eval/test_memory_classes_smoke.py tests/eval/test_agent_ablation_llm_baseline.py tests/eval/public/test_bfcl_smoke.py tests/eval/test_retrieval_baseline_gate.py tests/unit/application/test_tool_idempotency.py tests/unit/application/test_advance_run_budget.py tests/unit/application/test_advance_run_token_cost_budget.py tests/unit/application/test_context_engine_untrusted.py tests/unit/application/test_planner_port.py tests/unit/application/test_employee_publish_gate.py tests/unit/application/test_memory_working_procedural.py tests/unit/application/test_delete_persona.py -q --tb=short
      - run: python3 -m arbor.adapters.inbound.cli.eval_cli --suite public-bfcl-smoke --mode agent --strategy all
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e "../../.[api,postgres]"
        working-directory: apps/web
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  observability-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api,postgres,observability]"
      - run: docker compose -f infra/compose/observability.yml up -d loki tempo
      - name: Wait for Loki and Tempo
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/ready && curl -sf http://localhost:3200/ready && exit 0
            sleep 2
          done
          echo "observability stack not ready" && exit 1
      - run: python3 -m pytest tests/integration/observability -q -m integration --tb=short
        env:
          LOKI_URL: http://localhost:3100
          TEMPO_URL: http://localhost:3200
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
          OBSERVABILITY_ENABLED: "true"
          OTEL_SERVICE_NAME: arbor-api
          OBSERVABILITY_INTEGRATION_REQUIRED: "1"
