name: ci
on:
  pull_request:
  push:
    branches: [main, cursor/**]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit tests/architecture tests/eval tests/api tests/contract -q
      - run: python3 -m arbor.adapters.inbound.cli.eval_cli --suite v1 --strategy all
      - run: python3 -m arbor.adapters.inbound.cli.eval_cli --suite ragas-v1 --strategy all
