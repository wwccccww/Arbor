name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  generation-llm:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arbor
          POSTGRES_PASSWORD: arbor
          POSTGRES_DB: arbor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbor -d arbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arbor:arbor@localhost:5432/arbor
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ARBOR_JUDGE_API_KEY: ${{ secrets.ARBOR_JUDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api,postgres]"
      - name: Generation pytest (skipped without API key)
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: python3 -m pytest tests/eval -q -m llm
      - name: arbor-eval generation suite-v1
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        run: python3 -m arbor.adapters.inbound.cli.eval_cli --suite v1 --strategy layered_tree --mode generation --backend postgres
      - name: RAGAS faithfulness pytest
        if: ${{ env.DEEPSEEK_API_KEY != '' && env.ARBOR_JUDGE_API_KEY != '' }}
        run: python3 -m pytest tests/eval/test_generation_llm.py::test_suite_v1_generation_ragas_when_judge_configured -q -m llm
  agent-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api]"
      - run: python3 -m pytest tests/eval/test_agent_smoke.py tests/eval/test_memory_smoke.py tests/eval/test_multimodal_smoke.py tests/eval/test_retrieval_baseline_gate.py tests/unit/application/test_start_employee_eval.py tests/unit/application/test_employee_definition_version_pinning.py tests/unit/application/test_planner_port.py -q --tb=short
  nightly-agent-llm:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api]"
      - name: Agent ablation with real LLM planner (skip without key)
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        env:
          ARBOR_WRITE_LLM_BASELINE: "1"
        run: python3 -m pytest tests/eval/test_agent_ablation_llm.py -q -m llm --tb=short
  bge-retrieval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arbor
          POSTGRES_PASSWORD: arbor
          POSTGRES_DB: arbor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbor -d arbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arbor:arbor@localhost:5432/arbor
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api,postgres]"
      - name: arbor-eval ragas-v1 with bge-m3 (writes suite-ragas-v1-bge.json)
        if: ${{ env.EMBEDDING_API_KEY != '' || env.SILICONFLOW_API_KEY != '' }}
        run: |
          python3 -m arbor.adapters.inbound.cli.eval_cli --suite ragas-v1 --strategy layered_tree --backend postgres --embed bge
          python3 -m arbor.adapters.inbound.cli.eval_cli --suite ragas-v1 --strategy all --backend postgres --embed bge --write-baseline
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install pip-audit
      - run: pip install -e ".[dev,api,postgres]"
      - run: pip-audit
      - run: npm ci
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
  public-benchmark-llm:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api]"
      - name: Fetch public benchmark smoke fixtures
        run: python3 scripts/fetch_public_benchmarks.py --benchmark all --only smoke
      - name: Public benchmark smoke (Fake Planner gate)
        run: python3 -m pytest tests/eval/public -q --tb=short -m "not llm"
      - name: BFCL official dev with real LLM (writes bfcl-dev-llm.json)
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        env:
          ARBOR_WRITE_LLM_BASELINE: "1"
        run: |
          python3 -m pytest tests/eval/public/test_bfcl_llm_dev.py -q -m llm --tb=short
          python3 -m arbor.adapters.inbound.cli.eval_cli --suite public-bfcl-dev-llm --mode agent --planner llm \
            | tee eval/public/runs/nightly-bfcl-dev-llm-$(date -u +%Y%m%d).json
      - name: AgentDojo official dev with real LLM (writes agentdojo-dev-llm.json)
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        env:
          ARBOR_WRITE_LLM_BASELINE: "1"
        run: |
          python3 -m pytest tests/eval/public/test_agentdojo_llm_dev.py -q -m llm --tb=short
          python3 -m arbor.adapters.inbound.cli.eval_cli --suite public-agentdojo-dev-llm --mode agent --planner llm \
            | tee eval/public/runs/nightly-agentdojo-dev-llm-$(date -u +%Y%m%d).json
      - name: MultiHop official dev with real RAG+LLM (writes multihop-dev-llm.json)
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        env:
          ARBOR_WRITE_LLM_BASELINE: "1"
        run: |
          python3 -m pytest tests/eval/public/test_multihop_llm_dev.py -q -m llm --tb=short
          python3 -m arbor.adapters.inbound.cli.eval_cli --suite public-multihop-dev-llm --mode agent --planner llm \
            | tee eval/public/runs/nightly-multihop-dev-llm-$(date -u +%Y%m%d).json
      - name: RAGAS official 100 generation (writes ragas-official-generation.json)
        if: ${{ env.DEEPSEEK_API_KEY != '' && env.ARBOR_JUDGE_API_KEY != '' }}
        run: |
          pip install -r eval/requirements-eval.txt
          python3 -m pytest tests/eval/test_ragas_official_llm.py -q -m llm --tb=short
          python3 -m arbor.adapters.inbound.cli.eval_cli \
            --suite ragas-official-v1 --mode generation --strategy layered_tree --embed bge \
            --ragas-retrieval-preset default --write-baseline \
            | tee eval/public/runs/nightly-ragas-official-$(date -u +%Y%m%d).json
