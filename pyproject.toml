[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbor"
version = "0.1.0"
description = "Arbor persona memory workbench"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "fastapi>=0.110",
]
api = [
  "fastapi>=0.110",
  "httpx>=0.27",
]

[project.scripts]
arbor-eval = "arbor.adapters.inbound.cli.eval_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "postgres: needs DATABASE_URL and a real Postgres",
]

[tool.ruff]
line-length = 100
target-version = "py311"
