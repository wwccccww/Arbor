[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbor"
version = "0.1.0"
description = "Arbor persona memory workbench"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "ruff>=0.8",
  "mypy>=1.10",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "boto3>=1.34",
]
api = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.27",
  "prometheus-client>=0.20",
]
observability = [
  "prometheus-client>=0.20",
  "cryptography>=42",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
]
s3 = [
  "boto3>=1.34",
]
postgres = [
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
]
worker = [
  "arq>=0.26",
  "redis>=5",
]
documents = [
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
]
docling = [
  "docling>=2.0",
]
speech = [
  "faster-whisper>=1.0",
]
multimodal = [
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "docling>=2.0",
]

[project.scripts]
arbor-eval = "arbor.adapters.inbound.cli.eval_cli:main"
arbor-worker = "arbor.adapters.outbound.arq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arbor = [
  "adapters/outbound/postgres/schema.sql",
  "adapters/outbound/postgres/migrations/script.py.mako",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "postgres: needs DATABASE_URL and a real Postgres",
  "llm: needs DEEPSEEK_API_KEY; not required on pull requests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/arbor/adapters/**" = ["BLE001", "B008", "DTZ011", "EXE001", "RUF012"]
"src/arbor/application/memory/import_jobs.py" = ["BLE001"]
"src/arbor/observability/sampling.py" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
packages = ["arbor.domain", "arbor.ports"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
