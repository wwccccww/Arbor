# Alembic config for Arbor Postgres. Do not put passwords here.
#   DATABASE_URL=postgresql://arbor:arbor@127.0.0.1:5432/arbor alembic upgrade head

[alembic]
script_location = src/arbor/adapters/outbound/postgres/migrations
prepend_sys_path = src:.
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
